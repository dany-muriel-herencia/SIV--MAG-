<div class="bg-white rounded-2xl border border-slate-200/80 p-3 shadow-xs my-4">
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
    <div class="w-full sm:flex-1 min-w-[220px]">
      <app-search-input
        [value]="search()"
        (search)="searchChange.emit($event)"
        placeholder="Buscar categoría por nombre..."
      />
    </div>
    <div class="h-6 w-[1px] bg-slate-200 shrink-0 hidden sm:block"></div>
    <div class="shrink-0">
      <app-segmented-control
        [value]="statusFilter()"
        [options]="statusOptions()"
        (valueChange)="statusFilterChange.emit($event)"
      />
    </div>
  </div>
</div>
