<div class="min-h-screen flex items-center justify-center bg-slate-50">
  <div class="w-full max-w-md">

    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center
                  w-16 h-16 rounded-2xl bg-blue-600 mb-4">
        <i class="pi pi-shop text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">TiendaApp</h1>
      <p class="text-slate-500 text-sm mt-1">
        Sistema de gestión de inventario
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
      <h2 class="text-lg font-semibold text-slate-700 mb-6">
        Iniciar sesión
      </h2>

      <!-- Error -->
      @if (error()) {
        <div class="flex items-center gap-2 bg-red-50 border border-red-100
                    text-red-600 text-sm rounded-lg px-4 py-3 mb-5">
          <i class="pi pi-exclamation-circle"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()">

        <!-- Username -->
        <div class="mb-4">
          <label
            for="username"
            class="block text-sm font-medium text-slate-600 mb-1.5">
            Usuario
          </label>
          <div class="relative">
            <i class="pi pi-user absolute left-3 top-1/2 -translate-y-1/2
                       text-slate-400 text-sm"></i>
            <input
              id="username"
              type="text"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              name="username"
              placeholder="tu usuario"
              autocomplete="username"
              class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-slate-200
                     text-slate-800 text-sm placeholder:text-slate-400
                     focus:outline-none focus:ring-2 focus:ring-blue-500
                     focus:border-transparent transition" />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label
            for="password"
            class="block text-sm font-medium text-slate-600 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <i class="pi pi-lock absolute left-3 top-1/2 -translate-y-1/2
                       text-slate-400 text-sm"></i>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full pl-9 pr-10 py-2.5 rounded-lg border border-slate-200
                     text-slate-800 text-sm placeholder:text-slate-400
                     focus:outline-none focus:ring-2 focus:ring-blue-500
                     focus:border-transparent transition" />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2
                     text-slate-400 hover:text-slate-600 transition">
              <i [class]="showPassword()
                   ? 'pi pi-eye-slash'
                   : 'pi pi-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="!isFormValid() || isSubmitting()"
          class="w-full py-2.5 px-4 rounded-lg bg-blue-600 text-white
                 text-sm font-medium hover:bg-blue-700 active:bg-blue-800
                 disabled:opacity-50 disabled:cursor-not-allowed
                 transition flex items-center justify-center gap-2">
          @if (isSubmitting()) {
            <i class="pi pi-spin pi-spinner"></i>
            <span>Ingresando...</span>
          } @else {
            <span>Ingresar</span>
          }
        </button>

      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 mt-6">
      Solo personal autorizado
    </p>

  </div>
</div>
