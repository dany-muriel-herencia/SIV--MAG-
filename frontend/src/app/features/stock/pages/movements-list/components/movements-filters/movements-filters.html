<div class="bg-white rounded-2xl border border-slate-200/80 p-3 shadow-xs my-4">
  <div class="flex flex-wrap items-end gap-3">
    <!-- Búsqueda de producto -->
    <div class="flex-1 min-w-[240px]">
      <app-autocomplete-input
        [ngModel]="selectedProduct()"
        (ngModelChange)="productChange.emit($event)"
        [ngModelOptions]="{ standalone: true }"
        title="Filtrar por producto"
        placeholder="Buscar producto por nombre..."
        labelKey="name"
        trackByKey="id"
        [results]="productResults()"
        [isSearching]="isSearchingProduct()"
        (queryChange)="productQueryChange.emit($event)"
      />
    </div>

    <!-- Tipo de movimiento -->
    <div class="w-48">
      <app-selector
        [ngModel]="currentTypeObject()"
        (ngModelChange)="onTypeChange($event)"
        title="Tipo de movimiento"
        placeholder="Todos los tipos"
        icon="pi pi-filter"
        trackByKey="id"
        labelKey="name"
        [options]="statusOptions"
      />
    </div>

    <!-- Desde -->
    <div>
      <label class="block text-xs text-slate-500 font-semibold mb-1.5">Desde</label>
      <input
        type="date"
        [ngModel]="fromDate()"
        (ngModelChange)="fromDateChange.emit($event)"
        class="w-full px-3 py-2 text-xs font-medium bg-slate-50 border border-slate-200/80 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 text-slate-700 transition-all"
      />
    </div>

    <!-- Hasta -->
    <div>
      <label class="block text-xs text-slate-500 font-semibold mb-1.5">Hasta</label>
      <input
        type="date"
        [ngModel]="toDate()"
        (ngModelChange)="toDateChange.emit($event)"
        class="w-full px-3 py-2 text-xs font-medium bg-slate-50 border border-slate-200/80 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 text-slate-700 transition-all"
      />
    </div>

    <!-- Botón Limpiar Filtros -->
    @if (hasActiveFilters()) {
      <div>
        <button
          type="button"
          (click)="clearFilters.emit()"
          class="flex items-center gap-1.5 px-3 py-2 text-xs font-medium text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
          title="Restablecer todos los filtros"
        >
          <i class="pi pi-filter-slash text-xs"></i>
          Limpiar
        </button>
      </div>
    }
  </div>
</div>
