<div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-2xs">
  <div class="flex flex-wrap gap-4 items-end">
    <div class="flex flex-col gap-1.5 min-w-[140px]">
      <label class="text-xs font-semibold text-slate-500">Desde</label>
      <input
        type="date"
        [ngModel]="fromDate()"
        (ngModelChange)="fromDateChange.emit($event)"
        class="px-3 py-2 text-xs font-medium bg-slate-50 border border-slate-200/80 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 text-slate-700 transition-all"
      />
    </div>

    <div class="flex flex-col gap-1.5 min-w-[140px]">
      <label class="text-xs font-semibold text-slate-500">Hasta</label>
      <input
        type="date"
        [ngModel]="toDate()"
        (ngModelChange)="toDateChange.emit($event)"
        class="px-3 py-2 text-xs font-medium bg-slate-50 border border-slate-200/80 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 text-slate-700 transition-all"
      />
    </div>

    <div class="flex flex-col gap-1.5 min-w-[200px]">
      <app-selector
        [ngModel]="currentStatusObject()"
        (ngModelChange)="onStatusChange($event)"
        title="Estado"
        placeholder="Todos los estados"
        icon="pi pi-tag"
        labelKey="name"
        trackByKey="id"
        [options]="statusOptions"
      />
    </div>

    <!-- Filtro de Proveedor -->
    <div class="flex flex-col gap-1.5 min-w-[200px]">
      <app-selector
        [ngModel]="currentSupplierObject()"
        (ngModelChange)="onSupplierChange($event)"
        title="Proveedor"
        placeholder="Todos los proveedores"
        icon="pi pi-user"
        labelKey="name"
        trackByKey="id"
        [options]="suppliers()"
      />
    </div>
  </div>
</div>
