<div class="bg-white rounded-2xl border border-slate-200/80 p-3 shadow-xs my-4">
  <div class="flex flex-col md:flex-row items-center gap-3">
    <!-- 1. Input de Búsqueda -->
    <div class="w-full md:flex-1">
      <app-search-input
        [value]="search()"
        placeholder="Buscar por nombre, DNI o teléfono..."
        (search)="searchChange.emit($event)"
      />
    </div>

    <!-- Contenedor de Filtros Directos -->
    <div class="flex items-center gap-2.5 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
      <!-- 2. Segmented Control para Estado -->
      <app-segmented-control
        [value]="selectedStatus()"
        [options]="statusOptions"
        (valueChange)="statusChange.emit($event)"
      />

      <div class="h-6 w-[1px] bg-slate-200 shrink-0 hidden sm:block"></div>

      <!-- 3. Toggle "Con Deuda" -->
      <button
        type="button"
        (click)="debtFilter.emit(!hasDebt())"
        [class]="
          hasDebt()
            ? 'bg-amber-500 text-white border-amber-600 shadow-xs shadow-amber-200'
            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 hover:text-slate-900'
        "
        class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-medium border rounded-xl transition-all cursor-pointer shrink-0 select-none"
      >
        <i class="pi pi-credit-card text-xs"></i>
        <span>Solo con deuda</span>

        <span
          [class]="hasDebt() ? 'bg-white/30 text-white' : 'bg-slate-200 text-slate-500'"
          class="px-1.5 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider transition-colors"
        >
          {{ hasDebt() ? 'ON' : 'OFF' }}
        </span>
      </button>
    </div>
  </div>
</div>
