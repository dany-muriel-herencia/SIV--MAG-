<!-- sidebar.component.html -->
<aside
  [class]="collapsed()
    ? 'w-16'
    : 'w-64'"
  class="flex flex-col h-full bg-slate-900 transition-all duration-300
         shrink-0 overflow-hidden">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 py-5 border-b border-slate-800">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center
                justify-center shrink-0">
      <i class="pi pi-shop text-white text-sm"></i>
    </div>
    @if (!collapsed()) {
      <span class="text-white font-semibold text-sm tracking-wide">
        TiendaApp
      </span>
    }
  </div>

  <!-- Nav items -->
  <nav class="flex-1 py-4 overflow-y-auto overflow-x-hidden">
    @for (item of visibleItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-slate-800 text-white"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex items-center gap-3 px-4 py-2.5 mx-2 rounded-lg
               text-slate-400 hover:text-white hover:bg-slate-800
               transition-colors duration-150 group"
        [title]="collapsed() ? item.label : ''">

        <i [class]="'pi ' + item.icon"
           class="text-base shrink-0 w-5 text-center"></i>

        @if (!collapsed()) {
          <span class="text-sm font-medium">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- User info al fondo -->
  @if (!collapsed()) {
    <div class="border-t border-slate-800 px-4 py-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center
                    justify-center shrink-0">
          <i class="pi pi-user text-slate-300 text-xs"></i>
        </div>
        <div class="min-w-0">
          <p class="text-white text-xs font-medium truncate">
            {{ auth.currentUser()?.fullName }}
          </p>
          <p class="text-slate-500 text-xs truncate">
            {{ auth.currentUser()?.role }}
          </p>
        </div>
      </div>
    </div>
  }

</aside>
