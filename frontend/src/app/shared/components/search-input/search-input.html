<div class="relative w-full">
  <!-- Ícono de Lupa -->
  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-slate-600 transition-colors">
    <i class="pi pi-search text-xs sm:text-sm"></i>
  </div>

  <!-- Input con altura estandarizada de h-9 (36px) -->
  <input
    type="text"
    [value]="searchTerm()"
    (input)="onInputChange($any($event.target).value)"
    [placeholder]="placeholder()"
    class="w-full h-9 pl-9 pr-8 bg-slate-50/50 hover:bg-white focus:bg-white border border-slate-200/80 rounded-xl text-xs sm:text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-800 transition-all shadow-2xs"
  />

  <!-- Botón de Limpiar con área de clic mejorada -->
  @if (searchTerm()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600 active:text-slate-800 transition-colors cursor-pointer"
      title="Limpiar búsqueda"
    >
      <i class="pi pi-times-circle text-xs sm:text-sm"></i>
    </button>
  }
</div>
