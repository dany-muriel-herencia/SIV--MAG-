<div class="divide-y divide-slate-50">
  @for (i of rowsArray(); track $index) {
    <div class="flex items-center gap-4 px-6 py-4 animate-pulse">
      <div class="w-8 h-8 rounded-lg bg-slate-100 shrink-0"></div>
      <div class="flex-1 space-y-1.5 min-w-0">
        <div class="h-3 bg-slate-100 rounded w-1/3"></div>
        <div class="h-2.5 bg-slate-50 rounded w-1/4"></div>
      </div>
      <div class="h-3 bg-slate-100 rounded w-16 shrink-0 hidden sm:block"></div>
      <div class="h-3 bg-slate-100 rounded w-16 shrink-0 hidden md:block"></div>
      <div class="h-3 bg-slate-100 rounded w-16 shrink-0"></div>
    </div>
  }
</div>
