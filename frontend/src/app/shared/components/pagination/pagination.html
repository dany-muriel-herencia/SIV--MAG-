@if (totalPages() > 1) {
  <div class="flex items-center justify-between px-6 py-4 border-t border-slate-100">
    <!-- Rango -->
    <p class="text-xs text-slate-400">
      {{ rangeStart() }}–{{ rangeEnd() }} de {{ totalCount() }} {{ itemLabel() }}
    </p>

    <!-- Controles -->
    <div class="flex items-center gap-1">
      <!-- Primera página -->
      <button
        (click)="onPage(1)"
        [disabled]="currentPage() === 1"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        title="Primera página"
      >
        <i class="pi pi-angle-double-left text-xs"></i>
      </button>

      <!-- Anterior -->
      <button
        (click)="onPage(currentPage() - 1)"
        [disabled]="currentPage() === 1"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        title="Página anterior"
      >
        <i class="pi pi-chevron-left text-xs"></i>
      </button>

      <!-- Ellipsis inicial -->
      @if (showFirstEllipsis()) {
        <button
          (click)="onPage(1)"
          class="w-8 h-8 flex items-center justify-center rounded-lg text-xs text-slate-500 hover:bg-slate-100 transition-colors"
        >
          1
        </button>
        <span class="w-8 text-center text-slate-300 text-xs">···</span>
      }

      <!-- Páginas visibles -->
      @for (page of visiblePages(); track page) {
        <button
          (click)="onPage(page)"
          [class]="
            currentPage() === page
              ? 'bg-blue-600 text-white shadow-sm'
              : 'text-slate-500 hover:bg-slate-100'
          "
          class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-medium transition-colors"
        >
          {{ page }}
        </button>
      }

      <!-- Ellipsis final -->
      @if (showLastEllipsis()) {
        <span class="w-8 text-center text-slate-300 text-xs">···</span>
        <button
          (click)="onPage(totalPages())"
          class="w-8 h-8 flex items-center justify-center rounded-lg text-xs text-slate-500 hover:bg-slate-100 transition-colors"
        >
          {{ totalPages() }}
        </button>
      }

      <!-- Siguiente -->
      <button
        (click)="onPage(currentPage() + 1)"
        [disabled]="currentPage() === totalPages()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        title="Página siguiente"
      >
        <i class="pi pi-chevron-right text-xs"></i>
      </button>

      <!-- Última página -->
      <button
        (click)="onPage(totalPages())"
        [disabled]="currentPage() === totalPages()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        title="Última página"
      >
        <i class="pi pi-angle-double-right text-xs"></i>
      </button>
    </div>
  </div>
}
