<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 my-4">
  <!-- Total Clientes -->
  @if (totalCount()) {
    <div
      class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs flex items-center gap-4 transition-all hover:border-slate-300"
    >
      <div
        class="w-12 h-12 rounded-xl bg-slate-100 border border-slate-200/60 flex items-center justify-center text-slate-600 shrink-0"
      >
        <i class="pi pi-users text-xl"></i>
      </div>
      <div>
        <p class="text-xs font-medium text-slate-500">Total {{ title() }}</p>
        <h3 class="text-2xl font-bold text-slate-900 tracking-tight mt-0.5">{{ totalCount() }}</h3>
      </div>
    </div>
  }

  <!-- Clientes Activos -->
  @if (activesCount()) {
    <div
      class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs flex items-center gap-4 transition-all hover:border-emerald-200"
    >
      <div
        class="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-200/60 flex items-center justify-center text-emerald-600 shrink-0"
      >
        <i class="pi pi-check-circle text-xl"></i>
      </div>
      <div>
        <p class="text-xs font-medium text-slate-500">{{ title() }} Activos</p>

        <div class="flex items-center gap-2 mt-0.5">
          <h3 class="text-2xl font-bold text-slate-900 tracking-tight">{{ activesCount() }}</h3>
        </div>
      </div>
    </div>
  }

  <!-- Clientes Inactivos -->
  @if (inactivesCount()) {
    <div
      class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs flex items-center gap-4 transition-all hover:border-slate-300"
    >
      <div
        class="w-12 h-12 rounded-xl bg-slate-100/80 border border-slate-200/60 flex items-center justify-center text-slate-500 shrink-0"
      >
        <i class="pi pi-minus-circle text-xl"></i>
      </div>
      <div>
        <p class="text-xs font-medium text-slate-500">{{ title() }} Inactivos</p>
        <h3 class="text-2xl font-bold text-slate-900 tracking-tight mt-0.5">
          {{ inactivesCount() }}
        </h3>
      </div>
    </div>
  }

  <!-- Clientes con Deuda -->
  @if (debtCount()) {
    <div
      class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs flex items-center gap-4 transition-all hover:border-amber-200"
    >
      <div
        class="w-12 h-12 rounded-xl bg-amber-50 border border-amber-200/60 flex items-center justify-center text-amber-600 shrink-0"
      >
        <i class="pi pi-credit-card text-xl"></i>
      </div>
      <div>
        <p class="text-xs font-medium text-slate-500">{{ title() }} con Deuda</p>
        <h3 class="text-2xl font-bold text-slate-900 tracking-tight mt-0.5">{{ debtCount() }}</h3>
      </div>
    </div>
  }
</div>
